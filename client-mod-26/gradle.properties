org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# low CPU priority: the owner plays while this builds
org.gradle.priority=low

# THE 26.3 BUILD OF THE HUD MOD. ../client-mod is the 1.21.4 one and stays as
# it is; this project owns the files that talk to the game, and copies the ten
# that do not from there at build time (see build.gradle, sharedJava).
#
# Pinned, not floated, each read off Fabric's own maven and Fabric's example
# mod for 26.3 on 1 October 2026. Loom 1.18 is the line built for 26.x and
# needs Gradle 9 (9.7.1 here, the version the example mod ships); it refuses
# to load under 8.x. There is no Yarn for 26.x at all — the game ships
# unobfuscated under Mojang's own names, which is why every Minecraft name in
# this project differs from the 1.21.4 one. Gradle itself has to run on Java
# 25 for Loom 1.18 to load: JAVA_HOME = a Java 25, the launcher's own fetched
# runtime (%APPDATA%/Kestrel/runtimes/java-runtime-epsilon) or the JDK the
# toolchain resolver puts under ~/.gradle/jdks.
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.18.2
fabric_api_version=0.161.0+26.3

mod_version=0.1.0+mc26.3
maven_group=dev.kestrel
archives_base_name=kestrel-hud
