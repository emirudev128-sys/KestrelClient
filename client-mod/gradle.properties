org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Pinned, not floated, and loom is pinned to the line contemporary with the
# Minecraft version rather than the newest: loom 1.17 is built against Gradle
# 9.5 and refuses to load under 8.x. Newest is not a version policy.
# Pinned, not floated. Every one of these was read off Fabric's own maven
# rather than copied from a template: a version range in a build file is a
# build that stops reproducing the day upstream publishes.
minecraft_version=1.21.4
yarn_mappings=1.21.4+build.8
loader_version=0.19.4
loom_version=1.9.2
fabric_api_version=0.119.4+1.21.4

mod_version=0.1.0
maven_group=dev.kestrel
archives_base_name=kestrel-hud
